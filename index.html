
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#06090e" />
  <title>Responsive Dental Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #06090e;
      overflow-x: clip;
      overscroll-behavior-x: none;
    }

    body {
      width: 100%;
      min-height: 500vh;
      min-height: 500dvh;
      background: #06090e;
      overflow-x: clip;
      position: relative;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>

  <canvas id="canvas"></canvas>

  <script>
    (() => {
      "use strict";

      // ==============================
      // CONFIGURATION
      // ==============================

      const CONFIG = {
        frameCount: 118,
        framePath: "let/ezgif-frame-",
        frameExtension: ".jpg",

        scrollHeight: 500,

        // Black tint opacity
        tintOpacity: 0.35,

        // Smoothness
        lerp: 0.12,

        // Maximum device pixel ratio
        maxDPR: 2,

        // Image loading batch
        batchSize: 12
      };

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", {
        alpha: false,
        desynchronized: true
      });

      if (!ctx) return;

      const frames = new Array(CONFIG.frameCount);

      let currentProgress = 0;
      let targetProgress = 0;
      let lastRenderedIndex = -1;

      let viewportWidth = 0;
      let viewportHeight = 0;
      let dpr = 1;

      let animationStarted = false;
      let loadingStarted = false;

      // ==============================
      // FRAME URL
      // ==============================

      function getFrameURL(index) {
        return (
          CONFIG.framePath +
          String(index).padStart(3, "0") +
          CONFIG.frameExtension
        );
      }

      // ==============================
      // RESPONSIVE CANVAS
      // ==============================

      function resizeCanvas() {
        const viewport = window.visualViewport;

        viewportWidth = Math.round(
          viewport ? viewport.width : window.innerWidth
        );

        viewportHeight = Math.round(
          viewport ? viewport.height : window.innerHeight
        );

        dpr = Math.min(
          window.devicePixelRatio || 1,
          CONFIG.maxDPR
        );

        const newWidth = Math.round(viewportWidth * dpr);
        const newHeight = Math.round(viewportHeight * dpr);

        if (
          canvas.width !== newWidth ||
          canvas.height !== newHeight
        ) {
          canvas.width = newWidth;
          canvas.height = newHeight;
        }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        lastRenderedIndex = -1;

        renderFrame(
          Math.round(currentProgress * (CONFIG.frameCount - 1))
        );
      }

      // ==============================
      // IMAGE LOADING
      // ==============================

      function loadFrame(index) {
        return new Promise((resolve) => {
          const img = new Image();

          img.decoding = "async";

          img.onload = async () => {
            try {
              if (img.decode) {
                await img.decode();
              }

              frames[index - 1] = img;

              if (index === 1) {
                renderFrame(0);
              }

              resolve(true);
            } catch {
              frames[index - 1] = img;
              resolve(true);
            }
          };

          img.onerror = () => {
            console.warn(
              `Unable to load animation frame: ${index}`
            );
            resolve(false);
          };

          img.src = getFrameURL(index);
        });
      }

      async function preloadFrames() {
        if (loadingStarted) return;

        loadingStarted = true;

        // Load first frame immediately
        await loadFrame(1);

        // Load remaining frames in batches
        for (
          let start = 2;
          start <= CONFIG.frameCount;
          start += CONFIG.batchSize
        ) {
          const end = Math.min(
            start + CONFIG.batchSize - 1,
            CONFIG.frameCount
          );

          const batch = [];

          for (let i = start; i <= end; i++) {
            batch.push(loadFrame(i));
          }

          await Promise.all(batch);
        }
      }

      // ==============================
      // SCROLL PROGRESS
      // ==============================

      function getScrollProgress() {
        const scrollY = window.scrollY || 0;

        const maxScroll = Math.max(
          1,
          document.documentElement.scrollHeight -
          window.innerHeight
        );

        return Math.max(
          0,
          Math.min(1, scrollY / maxScroll)
        );
      }

      // ==============================
      // FIND AVAILABLE FRAME
      // ==============================

      function getAvailableFrame(index) {
        if (
          frames[index] &&
          frames[index].complete &&
          frames[index].naturalWidth > 0
        ) {
          return frames[index];
        }

        for (let offset = 1; offset < CONFIG.frameCount; offset++) {
          const previous = index - offset;
          const next = index + offset;

          if (
            previous >= 0 &&
            frames[previous] &&
            frames[previous].complete &&
            frames[previous].naturalWidth > 0
          ) {
            return frames[previous];
          }

          if (
            next < CONFIG.frameCount &&
            frames[next] &&
            frames[next].complete &&
            frames[next].naturalWidth > 0
          ) {
            return frames[next];
          }
        }

        return null;
      }

      // ==============================
      // RENDER FRAME
      // ==============================

      function renderFrame(index) {
        const frameIndex = Math.max(
          0,
          Math.min(CONFIG.frameCount - 1, index)
        );

        const img = getAvailableFrame(frameIndex);

        if (!img) return;

        const cw = viewportWidth;
        const ch = viewportHeight;

        if (!cw || !ch) return;

        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        // Adaptive image scaling
        const scale = Math.max(
          cw / iw,
          ch / ih
        );

        const drawWidth = iw * scale;
        const drawHeight = ih * scale;

        const offsetX = (cw - drawWidth) / 2;
        const offsetY = (ch - drawHeight) / 2;

        // Draw background and image
        ctx.fillStyle = "#06090e";
        ctx.fillRect(0, 0, cw, ch);

        ctx.drawImage(
          img,
          offsetX,
          offsetY,
          drawWidth,
          drawHeight
        );

        // Black tint overlay
        if (CONFIG.tintOpacity > 0) {
          ctx.fillStyle =
            `rgba(0, 0, 0, ${CONFIG.tintOpacity})`;

          ctx.fillRect(0, 0, cw, ch);
        }

        lastRenderedIndex = frameIndex;
      }

      // ==============================
      // ANIMATION LOOP
      // ==============================

      function animate() {
        targetProgress = getScrollProgress();

        currentProgress +=
          (targetProgress - currentProgress) * CONFIG.lerp;

        if (
          Math.abs(targetProgress - currentProgress) < 0.0001
        ) {
          currentProgress = targetProgress;
        }

        const frameIndex = Math.round(
          currentProgress * (CONFIG.frameCount - 1)
        );

        if (frameIndex !== lastRenderedIndex) {
          renderFrame(frameIndex);
        }

        requestAnimationFrame(animate);
      }

      // ==============================
      // EVENT LISTENERS
      // ==============================

      let resizeTimeout;

      function handleResize() {
        clearTimeout(resizeTimeout);

        resizeTimeout = setTimeout(() => {
          resizeCanvas();
        }, 100);
      }

      window.addEventListener("resize", handleResize, {
        passive: true
      });

      window.addEventListener("orientationchange", handleResize, {
        passive: true
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          handleResize,
          { passive: true }
        );
      }

      // ==============================
      // INITIALIZATION
      // ==============================

      function init() {
        if (animationStarted) return;

        animationStarted = true;

        resizeCanvas();

        requestAnimationFrame(animate);

        preloadFrames();
      }

      init();

    })();
  </script>

</body>
</html>
