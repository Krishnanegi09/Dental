<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      width: 100%;
      height: auto;
      background: #06090e;
    }
    body {
      width: 100%;
      min-height: 500vh;
      background: #06090e;
      position: relative;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const frameCount = 118;

    const pad = (n, width) => n.toString().padStart(width, '0');
    const getFrameUrl = (idx) => `let/ezgif-frame-${pad(idx, 3)}.jpg`;

    const images = new Array(frameCount);
    let loadedCount = 0;
    let currentProgress = 0;
    let targetProgress = 0;
    let lastRenderedIndex = -1;

    // Canvas sizing with Device Pixel Ratio
    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      lastRenderedIndex = -1; // force redraw
      renderFrame(Math.round(currentProgress * (frameCount - 1)));
    }

    // Preload all frames
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = getFrameUrl(i + 1);
      img.onload = () => {
        loadedCount++;
        images[i] = img;
        const curIdx = Math.round(currentProgress * (frameCount - 1));
        if (i === 0 || i === curIdx) {
          renderFrame(curIdx);
        }
      };
      images[i] = img;
    }

    // Accurate scroll progress calculation
    function getScrollProgress() {
      const scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      const maxScroll = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      ) - window.innerHeight;
      return maxScroll > 0 ? Math.max(0, Math.min(1, scrollY / maxScroll)) : 0;
    }

    function renderFrame(index) {
      const clampedIndex = Math.max(0, Math.min(frameCount - 1, index));
      
      // Get target image or closest available loaded image
      let img = images[clampedIndex];
      if (!img || !img.complete || img.naturalWidth === 0) {
        for (let offset = 1; offset < frameCount; offset++) {
          const prev = clampedIndex - offset;
          const next = clampedIndex + offset;
          if (prev >= 0 && images[prev] && images[prev].complete && images[prev].naturalWidth > 0) {
            img = images[prev];
            break;
          }
          if (next < frameCount && images[next] && images[next].complete && images[next].naturalWidth > 0) {
            img = images[next];
            break;
          }
        }
      }

      if (!img || !img.complete || img.naturalWidth === 0) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      // Maintain aspect ratio with cover scaling
      const scale = Math.max(cw / iw, ch / ih);
      const drawWidth = iw * scale;
      const drawHeight = ih * scale;
      const offsetX = (cw - drawWidth) / 2;
      const offsetY = (ch - drawHeight) / 2;

      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, iw, ih, offsetX, offsetY, drawWidth, drawHeight);

      // Aesthetic subtle cool cyan/blue tint overlay
      ctx.save();
      const tintGradient = ctx.createLinearGradient(0, 0, cw, ch);
      tintGradient.addColorStop(0, 'rgba(6, 182, 212, 0.16)');    // subtle vibrant cyan
      tintGradient.addColorStop(0.5, 'rgba(14, 165, 233, 0.12)');  // luminous dental sky-blue
      tintGradient.addColorStop(1, 'rgba(99, 102, 241, 0.15)');   // soft premium indigo
      ctx.fillStyle = tintGradient;
      ctx.fillRect(0, 0, cw, ch);
      ctx.restore();

      lastRenderedIndex = clampedIndex;
    }

    window.addEventListener('resize', resizeCanvas);

    // Continuous smooth animation loop with momentum lerp
    const LERP = 0.12;

    function animate() {
      targetProgress = getScrollProgress();
      currentProgress += (targetProgress - currentProgress) * LERP;

      if (Math.abs(targetProgress - currentProgress) < 0.0001) {
        currentProgress = targetProgress;
      }

      const frameIdx = Math.round(currentProgress * (frameCount - 1));
      if (frameIdx !== lastRenderedIndex) {
        renderFrame(frameIdx);
      }

      requestAnimationFrame(animate);
    }

    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
