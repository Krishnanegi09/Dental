<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <title>Dental Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        width: 100%;
        height: auto;
        background: #06090e;
        overflow-x: hidden;
      }
      body {
        width: 100%;
        min-height: 500vh;
        min-height: 500dvh;
        background: #06090e;
        position: relative;
        overflow-x: hidden;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        display: block;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const frameCount = 118;

      const pad = (n, width) => n.toString().padStart(width, "0");
      const getFrameUrl = (idx) => `let/ezgif-frame-${pad(idx, 3)}.jpg`;

      const images = new Array(frameCount);
      let loadedCount = 0;
      let currentProgress = 0;
      let targetProgress = 0;
      let lastRenderedIndex = -1;

      // Responsive canvas resolution matching DPR and screen orientation (portrait vs landscape)
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vpWidth = window.visualViewport
          ? window.visualViewport.width
          : window.innerWidth;
        const vpHeight = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

        canvas.width = Math.floor(vpWidth * dpr);
        canvas.height = Math.floor(vpHeight * dpr);

        lastRenderedIndex = -1; // force redraw
        renderFrame(Math.round(currentProgress * (frameCount - 1)));
      }

      // Preload all frames
      for (let i = 0; i < frameCount; i++) {
        const img = new Image();
        img.src = getFrameUrl(i + 1);
        img.onload = () => {
          loadedCount++;
          images[i] = img;
          const curIdx = Math.round(currentProgress * (frameCount - 1));
          if (i === 0 || i === curIdx) {
            renderFrame(curIdx);
          }
        };
        images[i] = img;
      }

      // Smooth scroll progress calculation
      function getScrollProgress() {
        const scrollY =
          window.pageYOffset ||
          document.documentElement.scrollTop ||
          document.body.scrollTop ||
          0;
        const docHeight = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
        );
        const vpHeight =
          window.innerHeight || document.documentElement.clientHeight || 1;
        const maxScroll = docHeight - vpHeight;
        return maxScroll > 0
          ? Math.max(0, Math.min(1, scrollY / maxScroll))
          : 0;
      }

      function renderFrame(index) {
        const clampedIndex = Math.max(0, Math.min(frameCount - 1, index));

        // Get target image or nearest loaded neighbor
        let img = images[clampedIndex];
        if (!img || !img.complete || img.naturalWidth === 0) {
          for (let offset = 1; offset < frameCount; offset++) {
            const prev = clampedIndex - offset;
            const next = clampedIndex + offset;
            if (
              prev >= 0 &&
              images[prev] &&
              images[prev].complete &&
              images[prev].naturalWidth > 0
            ) {
              img = images[prev];
              break;
            }
            if (
              next < frameCount &&
              images[next] &&
              images[next].complete &&
              images[next].naturalWidth > 0
            ) {
              img = images[next];
              break;
            }
          }
        }

        if (!img || !img.complete || img.naturalWidth === 0) return;

        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        ctx.clearRect(0, 0, cw, ch);

        // On phone and tablet in portrait mode (or any portrait viewport):
        // Formats as an immersive, full-bleed portrait experience filling the vertical screen.
        // On desktop and landscape viewports: formats as an edge-to-edge landscape experience.
        const scale = Math.max(cw / iw, ch / ih);
        const drawWidth = iw * scale;
        const drawHeight = ih * scale;
        const offsetX = (cw - drawWidth) / 2;
        const offsetY = (ch - drawHeight) / 2;

        ctx.drawImage(
          img,
          0,
          0,
          iw,
          ih,
          offsetX,
          offsetY,
          drawWidth,
          drawHeight,
        );

        // Subtle cyan/sky-blue tint wash across the viewport
        // 3. Subtle black tint overlay
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.50)";
        ctx.fillRect(0, 0, cw, ch);
        ctx.restore();

        lastRenderedIndex = clampedIndex;
      }

      window.addEventListener("resize", resizeCanvas);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeCanvas);
      }
      window.addEventListener("orientationchange", resizeCanvas);

      // Continuous smooth animation loop with momentum lerp
      const LERP = 0.12;

      function animate() {
        targetProgress = getScrollProgress();
        currentProgress += (targetProgress - currentProgress) * LERP;

        if (Math.abs(targetProgress - currentProgress) < 0.0001) {
          currentProgress = targetProgress;
        }

        const frameIdx = Math.round(currentProgress * (frameCount - 1));
        if (frameIdx !== lastRenderedIndex) {
          renderFrame(frameIdx);
        }

        requestAnimationFrame(animate);
      }

      resizeCanvas();
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
